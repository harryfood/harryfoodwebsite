<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Admin HarryFood</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f3f3f3; margin:0; padding:20px; }
    h1 { color:#0067b8; }
    #login, #adminPanel { margin-top:20px; }
    input, button { margin:5px 0; padding:8px; }
    table { border-collapse: collapse; width: 100%; margin-top:20px; background:white; }
    th, td { border:1px solid #ccc; padding:10px; text-align:center; }
    th { background:#0067b8; color:white; }
    button { padding:6px 10px; margin:2px; border:none; cursor:pointer; }
    .btn-add { background:#28a745; color:white; }
    .btn-add:hover { background:#218838; }
    .btn-reduce { background:#dc3545; color:white; }
    .btn-reduce:hover { background:#c82333; }
    .btn-done { background:#007bff; color:white; }
    .btn-done:hover { background:#0056b3; }
  </style>
</head>
<body>
  <h1>Admin HarryFood</h1>

  <!-- Đăng nhập -->
  <div id="login">
    <p>Nhập mật khẩu để truy cập:</p>
    <input type="password" id="password">
    <button onclick="checkPassword()">Đăng nhập</button>
  </div>

  <!-- Panel quản lý -->
  <div id="adminPanel" style="display:none;">
    <h2>Quản lý tồn kho</h2>
    <table id="stockTable">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Tồn kho hiện tại</th>
          <th>Số lượng nhập/giảm</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Dashboard đơn hàng</h2>
    <table id="orderTable">
      <thead>
        <tr>
          <th>Khách hàng</th>
          <th>Sản phẩm</th>
          <th>Số lượng</th>
          <th>Thời gian</th>
          <th>Lớp</th>
          <th>Ngày giao hàng</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Register Users</h2>
    <form id="registerForm">
      <label>ID User:</label>
      <input type="text" id="userId" required>

      <label>Username:</label>
      <input type="text" id="username" required>

      <label>Nickname:</label>
      <input type="text" id="nickname" required>

      <label>Class:</label>
      <input type="text" id="class" required>

      <button type="submit" class="btn-add">Add</button>
    </form>

    <h2>Danh sách người dùng</h2>
    <table id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Nickname</th>
          <th>Class</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  const ADMIN_PASS = "123@123a#250114*166466!9078678564543"; // mật khẩu siêu mạnh

  const products = [
    "C2 Calamansi Tea",
    "C2 Lemon Tea",
    "C2 Lychee Tea",
    "C2 Icy Mint Lemon",
    "C2 Strawberry Cherry",
    "C2 Melon Mint",
    "Fuze Tea Lemon Lemongrass",
    "Pepsi Cola",
    "Mirinda Soda Cream",
    "Coca Cola",
    "Sprite",
    "7Up"
  ];

  function checkPassword() {
    const pass = document.getElementById("password").value;
    if (pass === ADMIN_PASS) {
      document.getElementById("login").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      loadStockTable();
      loadOrders();
      loadUsers();
    } else {
      alert("Sai mật khẩu!");
    }
  }

  // ===== Quản lý tồn kho =====
  async function loadStockTable() {
    const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/inventory");
    const inventory = await res.json();

    const tbody = document.querySelector("#stockTable tbody");
    tbody.innerHTML = "";

    products.forEach(product => {
      let stock = parseInt(inventory[product] || "0");

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${product}</td>
        <td id="stock-${product.replace(/\s+/g,'-')}">${stock}</td>
        <td><input type="number" id="input-${product.replace(/\s+/g,'-')}" value="0"></td>
        <td>
          <button class="btn-add" onclick="updateStock('${product}','add')">Nhập thêm</button>
          <button class="btn-reduce" onclick="updateStock('${product}','reduce')">Giảm</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function updateStock(product, action) {
    const inputId = "input-" + product.replace(/\s+/g,'-');
    const qty = parseInt(document.getElementById(inputId).value);

    if (isNaN(qty) || qty <= 0) {
      alert("Vui lòng nhập số lượng hợp lệ!");
      return;
    }

    const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/inventory", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product, qty, action })
    });

    if (!res.ok) {
      alert("Có lỗi khi cập nhật tồn kho!");
      return;
    }

    loadStockTable();
  }

  // ===== Dashboard đơn hàng =====
  async function loadOrders() {
    const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/orders");
    const orders = await res.json();

    const tbody = document.querySelector("#orderTable tbody");
    tbody.innerHTML = "";

    orders.forEach(order => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${order.customerName}</td>
        <td>${order.product}</td>
        <td>${order.quantity}</td>
        <td>${new Date(order.time).toLocaleString()}</td>
        <td>${order.classroom}</td>
        <td>${order.deliveryDate || ""}</td>
        <td>
          <button class="btn-done" onclick="markDone('${order.id}')">Đã xử lý</button>
          <button class="btn-reduce" onclick="cancelOrder('${order.id}')">Huỷ</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function markDone(id) {
    await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/order/${id}?action=process`, { method: "POST" });
    alert("Đơn hàng đã xử lý!");
    loadOrders();
  }

  async function cancelOrder(id) {
    await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/order/${id}?action=cancel`, { method: "POST" });
    alert("Đơn hàng đã huỷ!");
    loadOrders();
    loadStockTable();
  }

  // ===== Register Users =====
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = document.getElementById("userId").value.trim();
    const username = document.getElementById("username").value.trim();
    const nickname = document.getElementById("nickname").value.trim();
    const className = document.getElementById("class").value.trim();

    const user = { id, username, nickname, class: className };

    try {
      const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/users/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(user)
      });
      if (!res.ok) {
        const data = await res.json();
        alert("Lỗi thêm user: " + (data.error || "Bad Request"));
        return;
      }
      alert("User đã được thêm thành công!");
      loadUsers();
    } catch (err) {
      alert("Không thể kết nối API: " + err.message);
    }
  });

   async function loadUsers() {
    try {
      const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/users/all");
      const data = await res.json();
      const tbody = document.querySelector("#usersTable tbody");
      tbody.innerHTML = "";
      data.forEach(user => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${user.id}</td>
          <td>${user.username}</td>
          <td>${user.nickname}</td>
          <td>${user.class}</td>
        `;
        tbody.appendChild(tr);
      });
    } catch (err) {
      alert("Không thể tải danh sách người dùng: " + err.message);
    }
  }
</script>
</body>
</html>
