<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HarryFood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    :root {
      --bg-color: #f3f3f3;
      --text-color: #222;
      --header-bg: #0067b8;
      --header-text: #fff;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #eee;
      --header-bg: #333;
      --header-text: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("backroomss1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
    }

    body.dark-mode::before {
      background: url("universess1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 60px 20px 40px;
      text-align: center;
      position: relative;
    }

    /* Nút Sign In / Nickname */
    .user-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      color: #0067b8;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: background 0.3s;
    }
    .user-badge:hover {
      background: #e6f0ff;
    }

    /* Câu chào random */
    #welcomeMessage {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--header-text);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    nav a {
      background: white;
      color: #0067b8;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    nav a:hover {
      background: #e6f0ff;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="welcomeMessage">HarryFood</h1>
    <nav>
      <a href="404.html">Giới thiệu</a>
      <a href="dathang.html">Đặt hàng trước</a>
      <a href="tintuc.html">Tin Tức</a>
      <a href="lienhe.html">Liên hệ</a>
      <a href="admin.html">Bảng Điều Khiển</a>
    </nav>
    <div style="margin-top:10px;">
      <button onclick="toggleTheme()">🌙/☀️</button>
      <select onchange="setLanguage(this.value)">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="userBadge" class="user-badge">Sign In</div>
  </header>

  <footer>© 2026 HarryFood · All rights reserved</footer>
  <footer>© HarryFood · WE DON'T USE ANY AI ON ANY OF OUR PRODUCTS</footer>
  <footer><br>This is not a real company</br></footer>

<script>
function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
}

function setLanguage(lang) {
  localStorage.setItem("lang", lang);
}

window.onload = async () => {
  // Theme
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  // Lấy uid từ URL hoặc localStorage
  const params = new URLSearchParams(window.location.search);
  let uid = params.get("uid") || localStorage.getItem("uid");

  const badge = document.getElementById("userBadge");
  const welcome = document.getElementById("welcomeMessage");

  if (!uid) {
    badge.textContent = "Sign In";
    badge.onclick = () => window.location.href = "signin.html";
    welcome.textContent = "Bạn chưa đăng nhập!";
    return;
  }

  try {
    const res = await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/users/${uid}`);
    const data = await res.json();

    if (data.error) {
      badge.textContent = "Sign In";
      badge.onclick = () => window.location.href = "signin.html";
      welcome.textContent = "User ID không tồn tại!";
      return;
    }

    const nickname = data.nickname;
    badge.textContent = nickname;

    const greetings = [
      `Chào mừng trở lại, ${nickname}!`,
      `Hôm nay ăn gì ngon đây, ${nickname}?`,
      `HarryFood luôn đồng hành cùng bạn, ${nickname}!`,
      `Sẵn sàng đặt món chưa, ${nickname}?`
    ];
    const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
    welcome.textContent = randomGreeting;
  } catch {
    welcome.textContent = "Không thể kết nối tới máy chủ!";
  }
};
</script>
</body>
</html>
