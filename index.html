<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HarryCorp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    :root {
      --bg-color: #f3f3f3;
      --text-color: #222;
      --header-bg: #0067b8;
      --header-text: #fff;
    }
    .dark-mode {
      --bg-color: #121212;
      --text-color: #eee;
      --header-bg: #333;
      --header-text: #fff;
    }
    body {
      position: relative;
      margin:0;
      font-family:"Segoe UI",Arial,sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("backroomss1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
      background-color: #f3f3f3; /* fallback nếu ảnh lỗi */
    }
    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding:60px 20px 40px;
      text-align:center;
    }
    header h1 { font-size:56px; margin-bottom:10px; }
    header p { font-size:20px; font-weight:500; margin-bottom:30px; }
    nav { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; }
    nav a { background:white; color:#0067b8; padding:12px 20px; border-radius:6px;
            text-decoration:none; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    nav a:hover { background:#e6f0ff; }
    footer { text-align:center; padding:30px; font-size:14px; color:#555; }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="homeTitle">HarryFood</h1>
    <p data-i18n="homeSlogan">Make eating better</p>
    <nav>
      <a href="404.html" data-i18n="navAbout">Giới thiệu</a>
      <a href="dathang.html" data-i18n="navOrder">Đặt hàng trước</a>
      <a href="tintuc.html" data-i18n="navNews">Tin Tức</a>
      <a href="lienhe.html" data-i18n="navContact">Liên hệ</a>
      <a href="admin.html" data-i18n="navAdminConsole">Bảng Điều Khiển</a>
    </nav>
    <div style="margin-top:10px;">
      <button onclick="toggleTheme()">🌙/☀️</button>
      <select onchange="setLanguage(this.value)">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </div>
  </header>

  <footer>© 2026 HarryFood · All rights reserved</footer>
  <footer>© HarryFood · WE DON'T USE ANY AI ON ANY OF OUR PRODUCTS</footer>
  <footer><br>This is not a real company</br></footer>

<script>
const translations = {
  vi: {
    homeTitle: "HarryFood",
    homeSlogan: "Make eating better", // slogan giữ nguyên
    navAbout: "Giới thiệu",
    navOrder: "Đặt hàng trước",
    navNews: "Tin Tức",
    navContact: "Liên hệ",
    navAdminConsole: "Bảng Điều Khiển"
  },
  en: {
    homeTitle: "HarryFood",
    homeSlogan: "Make eating better",
    navAbout: "About",
    navOrder: "Pre-order",
    navNews: "News",
    navContact: "Contact",
    navAdminConsole: "Admin Console"
  }
};

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
}

function setLanguage(lang) {
  localStorage.setItem("lang", lang);
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (translations[lang][key]) {
      el.textContent = translations[lang][key];
    }
  });
}

window.onload = () => {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }
  const lang = localStorage.getItem("lang") || "vi";
  setLanguage(lang);
};
</script>
</body>
</html>
