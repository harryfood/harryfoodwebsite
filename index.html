<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HarryFood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    :root {
      --bg-color: #f3f3f3;
      --text-color: #222;
      --header-bg: #0067b8;
      --header-text: #fff;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #eee;
      --header-bg: #333;
      --header-text: #fff;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("backroomss1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
    }

    body.dark-mode::before {
      background: url("universess1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 60px 20px 40px;
      text-align: center;
      position: relative;
    }

    /* Nút Sign In / Nickname */
    .user-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      color: #0067b8;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-badge:hover {
      background: #e6f0ff;
    }

    .user-menu {
      position: absolute;
      top: 45px;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      min-width: 140px;
    }

    .user-menu div {
      padding: 10px;
      cursor: pointer;
    }
    .user-menu div:hover {
      background: #e6f0ff;
    }

    .hidden {
      display: none;
    }

    /* Logo + slogan hoặc câu chào random */
    #mainTitle {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--header-text);
      animation: fadeIn 1s ease-in-out;
    }
    #mainSlogan {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 30px;
      color: var(--header-text);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    nav a {
      background: white;
      color: #0067b8;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    nav a:hover {
      background: #e6f0ff;
    }

    footer {
      text-align: center;
      padding: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="mainTitle">HarryFood</h1>
    <p id="mainSlogan">Make eating better</p>
    <nav>
      <a href="404.html">Giới thiệu</a>
      <a href="dathang.html">Đặt hàng trước</a>
      <a href="tintuc.html">Tin Tức</a>
      <a href="lienhe.html">Liên hệ</a>
      <a href="admin.html">Bảng Điều Khiển</a>
    </nav>
    <div style="margin-top:10px;">
      <button onclick="toggleTheme()">🌙/☀️</button>
      <select onchange="setLanguage(this.value)">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </div>
    <div id="userBadge" class="user-badge">
      <span id="userName">Sign In</span>
      <div id="userMenu" class="user-menu hidden">
        <div onclick="viewAccount()">Xem tài khoản</div>
        <div onclick="logout()">Đăng xuất</div>
      </div>
    </div>
  </header>

  <footer>© 2026 HarryFood · All rights reserved</footer>
  <footer>© HarryFood · WE DON'T USE ANY AI ON ANY OF OUR PRODUCTS</footer>
  <footer><br>This is not a real company</br></footer>

<script>
function toggleTheme() {
  document.body.classList.toggle("dark-mode");
  localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
}

function setLanguage(lang) {
  localStorage.setItem("lang", lang);
}

window.onload = async () => {
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

  const params = new URLSearchParams(window.location.search);
  let uid = params.get("uid") || localStorage.getItem("uid");

  const badge = document.getElementById("userBadge");
  const userName = document.getElementById("userName");
  const title = document.getElementById("mainTitle");
  const slogan = document.getElementById("mainSlogan");

  if (!uid) {
    userName.textContent = "Sign In";
    badge.onclick = () => window.location.href = "signin.html";
    title.textContent = "HarryFood";
    slogan.textContent = "Make eating better";
    return;
  }

  try {
    const res = await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/users/${uid}`);
    const data = await res.json();

    if (data.error) {
      userName.textContent = "Sign In";
      badge.onclick = () => window.location.href = "signin.html";
      title.textContent = "HarryFood";
      slogan.textContent = "Make eating better";
      return;
    }

    const nickname = data.nickname;
    userName.textContent = nickname;

    const greetings = [
      `Chào mừng trở lại, ${nickname}!`,
      `Hôm nay ăn gì ngon đây, ${nickname}?`,
      `HarryFood luôn đồng hành cùng bạn, ${nickname}!`,
      `Sẵn sàng đặt món chưa, ${nickname}?`
    ];
    const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];

    title.textContent = randomGreeting;
    slogan.textContent = "";
  } catch {
    title.textContent = "HarryFood";
    slogan.textContent = "Make eating better";
  }
};

// Toggle menu khi click nickname
document.getElementById("userBadge").addEventListener("click", () => {
  const name = document.getElementById("userName").textContent;
  if (name === "Sign In") {
    window.location.href = "signin.html";
  } else {
    document.getElementById("userMenu").classList.toggle("hidden");
  }
});

function viewAccount() {
  alert("Xem thông tin tài khoản (sẽ mở trang profile).");
}

function logout() {
  localStorage.removeItem("uid");
  window.location.href = "index.html";
}
</script>
</body>
</html>
