<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết đặt hàng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <style>
  :root {
    --main-color: #0067b8;
    --text-color: #222;
    --bg-blur: 6px;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text-color);
    background: #f3f3f3;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url("backroomss1.png") no-repeat center center;
    background-size: cover;
    filter: blur(var(--bg-blur));
    z-index: -1;
  }

  /* Tiêu đề giống dathang.html */
  header {
    text-align: center;
    padding: 60px 20px 30px;
    color: #ff6600;
    font-weight: 700;
  }

  header h1 {
    font-size: 52px;
    margin-bottom: 10px;
  }

  header p {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 25px;
    color: #222;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  nav a {
    background: white;
    color: var(--main-color);
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: background 0.3s;
  }

  nav a:hover {
    background: #e6f0ff;
  }

  /* Nút người dùng */
  .user-badge {
    position: fixed;
    top: 20px;
    right: 20px;
    background: white;
    color: var(--main-color);
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
  }

  .user-badge:hover {
    background: #e6f0ff;
  }

  .user-menu {
    position: absolute;
    top: 45px;
    right: 0;
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
    min-width: 140px;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateY(-5px);
  }

  .user-menu div {
    padding: 10px;
    cursor: pointer;
  }

  .user-menu div:hover {
    background: #e6f0ff;
  }

  .hidden {
    display: none;
    opacity: 0 !important;
  }

  .user-menu:not(.hidden) {
    opacity: 1;
    transform: translateY(0);
  }

  /* Form giữa trang, giống dathang.html */
  form#detailForm {
    background: rgba(255,255,255,0.9);
    max-width: 420px;
    margin: 40px auto;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: fadeIn 0.6s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  form#detailForm label {
    font-weight: 600;
    margin-bottom: 4px;
    color: #333;
  }

  form#detailForm input,
  form#detailForm select {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s;
  }

  form#detailForm input:focus,
  form#detailForm select:focus {
    border-color: var(--main-color);
  }

  form#detailForm button {
    background: var(--main-color);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
  }

  form#detailForm button:hover {
    background: #005aa3;
  }

  /* Nút trở về */
  button[onclick="goBack()"] {
    display: block;
    margin: 20px auto;
    background: #fff;
    color: var(--main-color);
    border: 2px solid var(--main-color);
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }

  button[onclick="goBack()"]:hover {
    background: #e6f0ff;
  }

  /* Thông tin sản phẩm */
  h2#productName, p#productPrice, p#productStock {
    text-align: center;
    font-weight: 600;
  }

  p#productPrice {
    color: var(--main-color);
  }
</style>


</head>
<body>
<header>
    <h1>Chi tiết đặt hàng</h1>
    <p>Trang chi tiết sản phẩm HarryFood</p>
    <nav>
      <a href="dathang.html">Quay lại đặt hàng?</a>
    </nav>
    <!-- Nút người dùng -->
    
</header>

<h2 id="productName"></h2>
<p id="productPrice"></p>
<div id="userBadge" class="user-badge">
      <span id="userName">Sign In</span>
      <div id="userMenu" class="user-menu hidden">
        <div onclick="viewAccount()">Xem tài khoản</div>
        <div onclick="logout()">Đăng xuất</div>
      </div>
    </div>

<form id="detailForm">
  <label>Trạng thái sản phẩm:</label>
  <input type="radio" name="status" value="Bình thường" checked> Bình thường
  <input type="radio" name="status" value="Lạnh"> Lạnh<br><br>

  <label>Số lượng:</label>
  <input type="number" name="quantity" min="1" value="1" required><br><br>

  <label>Tên:</label>
  <input type="text" name="customerName" placeholder="Nhập tên của bạn" required><br><br>

  <label>Lớp:</label>
  <select name="classroom" required>
    <option value="7i1">7i1</option>
    <option value="7th2">7TH2</option>
  </select><br><br>

  <label>Ngày giao hàng:</label>
  <input type="date" name="deliveryDate" required><br><br>

  <button type="submit">Xác nhận đặt hàng</button>
</form>

<br>
<button onclick="goBack()">⬅️ Trở về Đặt Hàng</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const product = params.get("product");

  const productPrices = {
    "C2 Calamansi Tea": 13000,
    "C2 Lemon Tea": 13000,
    "C2 Lychee Tea": 13000,
    "C2 Icy Mint Lemon": 13000,
    "C2 Strawberry Cherry": 13000,
    "C2 Melon Mint": 13000,
    "Fuze Tea Lemon Lemongrass": 10000,
    "Pepsi Cola": 9000,
    "Mirinda Soda Cream": 9000,
    "Coca Cola": 9000,
    "Sprite": 9000,
    "7Up": 9000
  };

  document.getElementById("productName").textContent = product;
  document.getElementById("productPrice").textContent = "Giá: " + productPrices[product] + " VND";

  // Lấy tồn kho từ API
  async function loadStock() {
    try {
      const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/inventory");
      const data = await res.json();
      document.getElementById("productStock").textContent = data[product] || "0";
    } catch {
      document.getElementById("productStock").textContent = "Lỗi tải tồn kho";
    }
  }
  loadStock();

  document.getElementById("detailForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    const status = form.status.value;
    const quantity = parseInt(form.quantity.value, 10);
    const customerName = form.customerName.value.trim();
    const classroom = form.classroom.value;
    const deliveryDate = form.deliveryDate.value;

    const order = {
      customerName,
      classroom,
      product,
      status,
      quantity,
      deliveryDate,
      time: new Date().toLocaleString()
    };

    try {
      const res = await fetch("https://harryfoodapi.minecraftalex052.workers.dev/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      const data = await res.json();

      if (!res.ok) {
        alert("Có lỗi khi ghi nhận đơn hàng: " + (data.error || "Bad Request"));
        return;
      }

      Array.from(form.elements).forEach(el => el.disabled = true);
      alert("Đơn hàng cho " + product + " đã được ghi nhận!");

      setTimeout(() => {
        window.location.href = "dathang.html";
      }, 1500);

    } catch (err) {
      alert("Không thể kết nối tới API: " + err.message);
    }
  });

  function goBack() {
    window.location.href = "dathang.html";
  }

  // --- User Badge logic ---
  window.onload = async () => {
    const badge = document.getElementById("userBadge");
    const userName = document.getElementById("userName");
    const menu = document.getElementById("userMenu");

    const params = new URLSearchParams(window.location.search);
    let uid = params.get("uid") || localStorage.getItem("uid");

    if (!uid) {
      userName.textContent = "Sign In";
      badge.onclick = () => window.location.href = "signin.html?redirect=detail.html";
      return;
    }

    try {
      const resUser
    try {
      const resUser = await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/users/${uid}`);
      const data = await resUser.json();

      if (data.error) {
        userName.textContent = "Sign In";
        badge.onclick = () => window.location.href = "signin.html?redirect=detail.html";
        return;
      }

      userName.textContent = data.nickname;
      badge.onclick = () => menu.classList.toggle("hidden");
    } catch {
      userName.textContent = "Sign In";
      badge.onclick = () => window.location.href = "signin.html?redirect=detail.html";
    }
  };

  function viewAccount() {
    const uid = localStorage.getItem("uid");
    if (uid) {
      window.location.href = `profile.html?uid=${uid}`;
    } else {
      window.location.href = "signin.html?redirect=detail.html";
    }
  }

  function logout() {
    localStorage.removeItem("uid");
    window.location.href = "index.html";
  }

  // Đóng menu khi click ra ngoài
  document.addEventListener("click", (e) => {
    const menu = document.getElementById("userMenu");
    const badge = document.getElementById("userBadge");
    if (!badge.contains(e.target) && !menu.contains(e.target)) {
      menu.classList.add("hidden");
    }
  });
</script>
</body>
</html>
