<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>HarryFood - Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("backroomss1.png") no-repeat center center;
      background-size: cover;
      filter: blur(6px);
      z-index: -1;
    }

    .container {
      max-width: 400px;
      margin: 100px auto;
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #0067b8;
    }

    .info {
      text-align: left;
      margin-top: 20px;
    }

    .info p {
      margin: 8px 0;
      font-size: 16px;
    }

    .error {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #0067b8;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #00509d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Thông tin tài khoản</h1>
    <div id="profileInfo" class="info"></div>
    <div id="errorMessage" class="error"></div>
    <div class="btn-group">
      <button onclick="goHome()">Trang chủ</button>
      <button onclick="logout()">Đăng xuất</button>
    </div>
  </div>

<script>
window.onload = async () => {
  const params = new URLSearchParams(window.location.search);
  let uid = params.get("uid") || localStorage.getItem("uid");

  const info = document.getElementById("profileInfo");
  const error = document.getElementById("errorMessage");

  if (!uid) {
    error.textContent = "Bạn chưa đăng nhập!";
    setTimeout(() => window.location.href = "signin.html", 2000);
    return;
  }

  try {
    const res = await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/users/${uid}`);
    const data = await res.json();

    if (data.error) {
      error.textContent = "User ID không tồn tại!";
      setTimeout(() => window.location.href = "signin.html", 2000);
      return;
    }

    info.innerHTML = `
      <p><strong>Nickname:</strong> ${data.nickname}</p>
      <p><strong>Họ tên:</strong> ${data.name}</p>
      <p><strong>Lớp:</strong> ${data.class}</p>
      <p><strong>User ID:</strong> ${data.id}</p>
    `;
  } catch {
    error.textContent = "Không thể kết nối tới máy chủ!";
  }
};

function goHome() {
  window.location.href = "index.html";
}

function logout() {
  localStorage.removeItem("uid");
  window.location.href = "index.html";
}
</script>
</body>
</html>
