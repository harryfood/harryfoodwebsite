<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tin Tức</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/favicon.png">

<style>
    body { margin:0; font-family:"Segoe UI",Arial,sans-serif; background:#f3f3f3; color:#222; }
    header { background:#0067b8; color:white; padding:60px 20px 40px; text-align:center; }
    header h1 { font-size:56px; margin-bottom:10px; }
    header p { font-size:20px; font-weight:500; margin-bottom:30px; }
    nav { display:flex; justify-content:center; gap:30px; }
    nav a { background:white; color:#0067b8; padding:12px 20px; border-radius:6px;
            text-decoration:none; font-weight:600; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    nav a:hover { background:#e6f0ff; } 
    footer { text-align:center; padding:30px; font-size:14px; color:#555; }
body::before {
  content: "";
  position: fixed;
  top: 20px
  left: 0;
  width: 100%;
  height: calc(100% - 10px);
  background: url("backroomss1.png") no-repeat center center;
  background-size: cover;
  filter: blur(6px);
  z-index: -1;
}


p {
   font-size: 35px
}
</style>
</head>
<body>
  <header>
    <h1>Bảng tin về HarryCorp</h1>
   </header>
    <nav>
      <strong><a href="index.html">Trở về trang chủ?</a></strong>
    </nav>
<p> Sorry 😓 But there aren't any hot news about HarryFood. Please visit again next time, thank you for choosing HarryFood 🥰</p>
  
<footer>© 2026 HarryFood · All rights reserved</footer>
<footer>© HarryFood · WE DON'T USE ANY AI ON ANY OF OUR PRODUCTS</footer>
<script>
window.addEventListener("load", async () => {
  const badge = document.getElementById("userBadge");
  const userName = document.getElementById("userName");
  const menu = document.getElementById("userMenu");

  const params = new URLSearchParams(window.location.search);
  let uid = params.get("uid") || localStorage.getItem("uid");

  if (!uid) {
    userName.textContent = "Sign In";
    badge.onclick = () => {
      // Lấy URL hiện tại để redirect lại sau khi login
      const currentPage = window.location.pathname;
      window.location.href = `signin.html?redirect=${encodeURIComponent(currentPage)}`;
    };
    return;
  }

  try {
    const res = await fetch(`https://harryfoodapi.minecraftalex052.workers.dev/users/${uid}`);
    const data = await res.json();

    if (data.error) {
      userName.textContent = "Sign In";
      badge.onclick = () => {
        const currentPage = window.location.pathname;
        window.location.href = `signin.html?redirect=${encodeURIComponent(currentPage)}`;
      };
      return;
    }

    const nickname = data.nickname;
    userName.textContent = nickname;

    // Khi click nickname → mở menu
    badge.onclick = () => menu.classList.toggle("hidden");
  } catch {
    userName.textContent = "Sign In";
    badge.onclick = () => {
      const currentPage = window.location.pathname;
      window.location.href = `signin.html?redirect=${encodeURIComponent(currentPage)}`;
    };
  }
});

function viewAccount() {
  window.location.href = "profile.html";
}

function logout() {
  localStorage.removeItem("uid");
  window.location.href = "index.html";
}
</script>
</body>
</html>
